name: Setup pnpm and Node.js for CI/CD
description: Setup pnpm and Node.js for CI/CD workflows

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
    type: string

  pnpm-version:
    description: pnpm version
    required: false
    default: '11'
    type: string

outputs:
  node-version:
    description: Node.js version
    value: ${{ inputs.node-version }}

  pnpm-version:
    description: pnpm version
    value: ${{ inputs.pnpm-version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
