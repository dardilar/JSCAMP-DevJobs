name: 05 - CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
            
            - name: Prepare pnpm
              uses: pnpm/action-setup@v6
              with:
                version: 11
                run_install: false

            - name: Install dependecies
              run: pnpm install

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build