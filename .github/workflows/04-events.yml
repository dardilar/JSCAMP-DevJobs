name: 04 - Events

on:
    issues:
        types: [opened, reopened]
    issue_comment:
        types: [created]

jobs:
    inspect-event:
        runs-on: ubuntu-22.04
        steps:
            - name: Inspect event
              run: |
                echo "Event type: ${{ github.event_name }}"
                echo "Action: ${{ github.event.action }}"
                echo "Issue number: ${{ github.event.issue.number }}"
                echo "Comment body: ${{ github.event.comment.body }}"
    