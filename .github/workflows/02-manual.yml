name: 02 - Manual

on:
    workflow_dispatch:
        inputs:
            log_level:
                description: 'Nivel de log'
                required: true
                default: 'info'
                type: choice
                options:
                    - info
                    - debug
                    - warning
                    - error
            
            enviroment:
                description: 'Entorno'
                type: environment
            
            dry_run:
                description: 'Ejecutar en modo dry run'
                required: false
                type: boolean
                default: false

            reason:
                description: 'Razón de la ejecución'
                required: false
                default: 'Manual execution'
                type: string
                

jobs:
    manual:
        runs-on: ubuntu-22.04
        steps:
            - name: Print inputs
              env:
                LOG_LEVEL: ${{ inputs.log_level }}
                ENVIRONMENT: ${{ inputs.enviroment }}
                DRY_RUN: ${{ inputs.dry_run }}
                REASON: ${{ inputs.reason }}
              run: |
                echo "Log level: $LOG_LEVEL"
                echo "Environment: $ENVIRONMENT"
                echo "Dry run: $DRY_RUN"
                echo "Reason: $REASON"
            
            - name: Deploy (Si no es dry-run)
              if: ${{ !inputs.dry_run }}
              env:
                ENVIRONMENT: ${{ inputs.enviroment }}
                REASON: ${{ inputs.reason }}
              run: |
                echo "Deploying to $ENVIRONMENT"
                echo "Reason: $REASON"

            - name: Solo log si es dry-run
              if: ${{ inputs.dry_run }}
              run: |
                echo "Dry run: No changes applied"
