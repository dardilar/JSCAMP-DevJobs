name: 01 - Hello

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-22.04
    steps:
      - name: Saludar
        run: echo "Hello GitHub Actions"

      - name: Mostrar fecha actual
        run: date

      - name: Listar archivos
        run: ls -la

  repo-files:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v6

      - name: Listar archivos
        run: ls -la